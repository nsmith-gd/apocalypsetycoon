<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Layer: Styles</title>
<link rel="stylesheet" href="../src/ui/ui.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #14110f; }
  .wrap { display: grid; grid-template-columns: 240px 1fr 300px; gap: 12px; padding: 12px; max-width: 1280px; margin: 0 auto; }
  .panel { background: var(--at-panel); border: 4px solid var(--at-border); box-shadow: inset 2px 2px 0 var(--at-hi); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 18px; letter-spacing: 3px; color: var(--at-gold); }
  .hint { grid-column: 1 / -1; color: var(--at-dim); font-size: 12px; margin-top: -6px; }
  h2 { margin: 0; font-size: 11px; letter-spacing: 2px; color: var(--at-dim); }
  .client { text-align: left; font: 700 12px var(--at-font); color: var(--at-ink); background: var(--at-panel-2); border: 2px solid var(--at-border); padding: 6px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .client small { color: var(--at-dim); font-weight: 400; }
  .client[data-active='true'] { border-color: var(--at-gold); box-shadow: inset 0 0 0 2px var(--at-gold); }
  .stage { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  canvas#shelter { image-rendering: pixelated; border: 4px solid var(--at-border); cursor: pointer; background: #0a0807; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .btns button { font: 900 12px var(--at-font); letter-spacing: 1px; color: var(--at-ink); background: var(--at-panel-2); border: 2px solid var(--at-border); box-shadow: inset 2px 2px 0 var(--at-hi); padding: 8px 10px; cursor: pointer; }
  .btns button[data-style='gilded'] { color: var(--at-gold); }
  .btns button[data-style='brutalist'] { color: #c8c4bc; }
  .score { font-size: 44px; font-weight: 900; line-height: 1; }
  .score[data-band='high'] { color: var(--at-green); } .score[data-band='mid'] { color: var(--at-gold); } .score[data-band='low'] { color: var(--at-red); }
  .meter { height: 12px; background: var(--at-border); border: 1px solid var(--at-hi); position: relative; }
  .meter i { display: block; height: 100%; background: var(--at-gold); transition: width .3s steps(6); }
  .formula { font-size: 12px; color: var(--at-dim); }
  .formula b { color: var(--at-ink); }
  .formula .s[data-rel='match'] { color: var(--at-green); } .formula .s[data-rel='clash'] { color: var(--at-red); }
  .rooms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 11px; }
  .rooms li { display: grid; grid-template-columns: 1fr auto auto; align-items: start; gap: 6px; padding: 2px 4px; background: var(--at-panel-2); }
  .rooms li[data-seen='false'] { opacity: .45; }
  .tag { font-size: 9px; font-weight: 900; letter-spacing: 1px; padding: 1px 4px; }
  .tag[data-rel='match'] { background: var(--at-green); color: var(--at-paper-ink); }
  .tag[data-rel='clash'] { background: var(--at-red); color: var(--at-paper-ink); }
  .tag[data-rel='neutral'] { background: var(--at-hi); }
  .pop { animation: pop .4s steps(3); } @keyframes pop { 0% { transform: scale(1.25); } }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body class="at-ui">
<div class="wrap">
  <h1>DESIGN LAYER · STYLES (GREYBOX)</h1>
  <div class="hint">Click a room to switch it between Brutalist and Gilded. Satisfaction = style multiplier s × Σ (willingness-to-pay weight × tier met). Match ×1.25, clash ×0.8.</div>
  <aside class="panel"><h2>CLIENT</h2><div id="clients"></div></aside>
  <section class="stage">
    <canvas id="shelter" width="1280" height="768"></canvas>
    <div class="btns">
      <button data-all="gilded" data-style="gilded">ALL GILDED</button>
      <button data-all="brutalist" data-style="brutalist">ALL BRUTALIST</button>
    </div>
  </section>
  <aside class="panel">
    <h2>SATISFACTION</h2>
    <div class="score" id="score"></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="formula" id="formula"></div>
    <div class="formula" id="prestige"></div>
    <h2>ROOMS THE CLIENT SEES</h2>
    <ul class="rooms" id="rooms"></ul>
  </aside>
</div>
<script type="module">
import { ShelterGrid } from '../src/shelter/grid.js';
import { roomInfo } from '../src/clients/rooms.js';
import { satisfaction, styledPrestige, nextStyle, STYLES, roomTier } from '../src/shelter/styles.js';
import { drawStyledShelter } from '../src/art/styleView.js';

// GDD hero clients (Characters table) for the two placeholder styles, plus a neutral one.
const CLIENTS = [
  { name: 'Lady Eleanor Ashcombe', wealthClass: 'C3', style: 'gilded', traits: ['Dynast'], note: 'C3 Dynasty · Gilded' },
  { name: 'Rex Calloway', wealthClass: 'C4', style: 'brutalist', traits: ['Control Freak', 'Paranoid'], note: 'C4 Mogul · Brutalist · Paranoid (inspects Survive rooms)' },
  { name: 'Gerald Pemberton-Wick', wealthClass: 'C1', style: 'retro_atomic', traits: ['Gourmand', 'Penny-Pincher'], note: 'C1 · Retro-Atomic (neutral to both)' },
];
let client = CLIENTS[0];

const grid = new ShelterGrid({ isUnlocked: () => true });
const LAYOUT = [
  [1, 1, 'bunk'], [2, 1, 'gold_taps'], [3, 1, 'wine_cellar'], [4, 1, 'air_vent'],
  [1, 2, 'water_tank'], [2, 2, 'pantry'], [3, 2, 'cryo_pod'], [4, 2, 'ai_butler'],
  [1, 3, 'hydroponics'], [2, 3, 'gold_taps'],
];
for (const [c, r, id] of LAYOUT) { grid.place(c, r, id); grid.at(c, r).built = true; }
const cv = document.getElementById('shelter');
let frame = 0;
let flash = null;
const draw = () => drawStyledShelter(cv.getContext('2d'), { cols: 10, rows: 6, rooms: grid.rooms.map((r) => ({ ...r, amenity: r.id })), frame, highlight: flash });

function render(pop = false) {
  const rooms = grid.rooms.map((r) => ({ ...r, prestige: roomInfo(r.id).prestige }));
  const sat = satisfaction(client, rooms);
  const score = document.getElementById('score');
  score.textContent = `${Math.round(sat.score)}%`;
  score.dataset.band = sat.score >= 70 ? 'high' : sat.score >= 45 ? 'mid' : 'low';
  if (pop) { score.classList.remove('pop'); void score.offsetWidth; score.classList.add('pop'); }
  document.getElementById('meter').style.width = `${sat.score}%`;
  const rel = sat.s > 1 ? 'match' : sat.s < 1 ? 'clash' : 'neutral';
  document.getElementById('formula').innerHTML = `Needs met <b>${sat.base}</b> × style <b class="s" data-rel="${rel}">s ${sat.s.toFixed(2)}</b> = <b>${sat.raw}</b>${sat.raw > 100 ? ' (capped at 100)' : ''}`;
  document.getElementById('prestige').innerHTML = `Prestige to this client: <b>${styledPrestige(client, rooms)}</b> (raw ${rooms.reduce((a, r) => a + r.prestige, 0)})`;
  document.getElementById('rooms').replaceChildren(...sat.rooms.map((d) => {
    const li = document.createElement('li');
    li.dataset.seen = String(d.seen);
    li.title = d.seen ? '' : 'Survive rooms: only Paranoid or Engineer clients look';
    const name = document.createElement('span'); name.textContent = `${roomInfo(d.room.id).name} · ${roomTier(d.room)}`;
    const st = document.createElement('span'); st.textContent = STYLES[d.style]?.name ?? '—';
    const tag = document.createElement('span'); tag.className = 'tag'; tag.dataset.rel = d.relation; tag.textContent = `${d.relation.toUpperCase()} ×${d.multiplier}`;
    li.append(name, st, tag);
    return li;
  }));
  draw();
}

const clientsEl = document.getElementById('clients');
function renderClients() {
  clientsEl.replaceChildren(...CLIENTS.map((c) => {
    const b = document.createElement('button');
    b.className = 'client'; b.dataset.active = String(c === client);
    b.innerHTML = `<span>${c.name}</span><small>${c.note}</small><small>Loves: ${STYLES[c.style].name}</small>`;
    b.onclick = () => { client = c; renderClients(); render(true); };
    return b;
  }));
}

cv.addEventListener('click', (e) => {
  const rect = cv.getBoundingClientRect();
  const col = Math.floor(((e.clientX - rect.left) / rect.width) * 10);
  const row = Math.floor(((e.clientY - rect.top) / rect.height) * 6);
  const cell = grid.at(col, row);
  if (!cell) return;
  grid.setStyle(col, row, nextStyle(cell.style));
  flash = { col, row };
  setTimeout(() => { flash = null; draw(); }, 400);
  render(true);
});
for (const b of document.querySelectorAll('[data-all]')) b.onclick = () => { for (const r of grid.rooms) grid.setStyle(r.col, r.row, b.dataset.all); render(true); };

const fit = () => { cv.style.width = '1280px'; cv.style.height = '768px'; cv.style.maxWidth = 'none'; }; // 64 px art at 1x (whole-number scale); the stage scrolls on small screens
window.addEventListener('resize', fit);
setInterval(() => { frame++; draw(); }, 500);
renderClients(); fit(); render();
window.__demo = { grid, setClient: (i) => { client = CLIENTS[i]; renderClients(); render(); }, satisfaction: () => satisfaction(client, grid.rooms) };
</script>
</body>
</html>
