<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom Clock Demo</title>
<link rel="stylesheet" href="../src/ui/ui.css">
<link rel="stylesheet" href="../src/doomclock/doomclock.css">
<link rel="stylesheet" href="../src/midnight/midnight.css">
<style>
  html, body { margin: 0; background: #14110f; }
  #game { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 16px; font-family: 'Courier New', monospace; color: #f2e6c9; width: 100%; box-sizing: border-box; }
  .big { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: center; background: #241f1a; border: 3px solid #0a0807; padding: 12px; margin-bottom: 12px; }
  .big canvas { width: 192px; height: 192px; image-rendering: pixelated; }
  .big .read { font-size: 13px; line-height: 1.7; }
  .big .read b { font-size: 30px; color: #f5c542; display: block; letter-spacing: 2px; }
  .big .read .formula { color: #a8977a; font-size: 12px; }
  .tracks { background: #241f1a; border: 3px solid #0a0807; padding: 10px; margin-bottom: 12px; }
  .track { display: grid; grid-template-columns: 110px 1fr 120px auto; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; }
  .track .bar { position: relative; height: 14px; background: #0a0807; border: 1px solid #4a3f33; }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #7ed957; }
  .track .tip { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #ff5a4f; }
  .track .brinkline { position: absolute; top: -2px; bottom: -2px; width: 1px; background: #ff9f1c; }
  .track[data-state=brink] .fill { background: #ff9f1c; }
  .track[data-state=breach] .fill { background: #ff5a4f; }
  .track[data-state=collapsed] { opacity: 0.55; }
  .track[data-state=collapsed] .fill { background: #7a2a3a; }
  .track .info { color: #a8977a; font-size: 11px; }
  button { font-family: inherit; font-weight: 700; font-size: 11px; padding: 6px 8px; color: #f2e6c9; background: #2f2821; border: 2px solid #0a0807; box-shadow: inset 2px 2px 0 #4a3f33; cursor: pointer; }
  button.hot { background: #f5c542; color: #2a2118; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .log { background: #0a0807; border: 2px solid #4a3f33; padding: 8px; font-size: 11px; height: 130px; overflow: auto; color: #a8977a; }
  .log div:first-child { color: #f2e6c9; }
  @media (max-width: 640px) { .big { grid-template-columns: 1fr; } .track { grid-template-columns: 80px 1fr; } .track .info, .track .btns { grid-column: span 2; } }
</style>
</head>
<body>
<div id="game">
  <div class="wrap">
    <div class="big"><canvas id="bigface" width="32" height="32"></canvas><div class="read" id="read"></div></div>
    <div class="controls" id="controls"></div>
    <div class="tracks" id="tracks"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script type="module">
import { Ledger } from '../src/ledger/ledger.js';
import { createGameUI } from '../src/ui/hud.js';
import { DoomClock } from '../src/doomclock/doomclock.js';
import { createDoomClockHud } from '../src/doomclock/doomclock-hud.js';
import { computeMidnight } from '../src/midnight/midnight.js';
import { showMidnight, showClockStrike } from '../src/midnight/midnight-ui.js';

// Stand-in crisis tracks until the schemes / world-map tasks provide real ones.
const TRACKS = [
  { id: 'pandemic', name: 'Pandemic', tip: 90, tension: 20 },
  { id: 'climate', name: 'Climate', tip: 92, tension: 30 },
  { id: 'unrest', name: 'Civil unrest', tip: 88, tension: 25 },
  { id: 'markets', name: 'Markets', tip: 90, tension: 15 },
  { id: 'war', name: 'War', tip: 94, tension: 10 },
];
const params = new URLSearchParams(location.search);
const ledger = new Ledger({ startingCash: 400_000 });
const root = document.getElementById('game');
const ui = createGameUI({ root, ledger });
const clock = new DoomClock();
const hudClock = createDoomClockHud({ clock, hud: root.querySelector('.hud') });
const state = { quarter: 1, totalQuarters: 12, week: 0 };
const track = Object.fromEntries(TRACKS.map((t) => [t.id, { ...t, state: 'calm', breached: false }]));
const logEl = document.getElementById('log');
const log = (msg) => { const d = document.createElement('div'); d.textContent = `W${clock.week} · ${msg}`; logEl.prepend(d); };

clock.on('floor', (e) => log(`Floor -${e.drop} (${e.reason}${e.track ? `: ${e.track}` : ''}) → ${e.floor} min. Tipping points now ${clock.minutesLost} lower.`));
clock.on('countdown', (e) => log(e.weeks === 4 ? 'SECOND COLLAPSE: the Final Countdown begins. Midnight in 4 weeks.' : `Final Countdown: ${e.weeks} weeks.`));
clock.on('midnight', async (e) => {
  log(`MIDNIGHT (${e.reason === 'clock' ? 'the clock struck zero' : 'the countdown ran out'}).`);
  stopAuto();
  render();
  const shelters = [{ id: 'hq', name: 'Last Resort HQ', owner: 'your board', occupants: 6, rooms: ['mil_scrubber', 'water_recycler', 'hydroponics'] }];
  const result = computeMidnight({ shelters, world: { tension: 100, heat: 40, runaways: clock.collapses.length }, cash: ledger.cash, forceType: 'failed',
    cause: e.reason === 'clock' ? 'The Doom Clock struck zero before you were ready.' : 'Two collapses started a Final Countdown you could not stop.' });
  window.__demo.result = result;
  if (params.has('nomidnight')) return;
  await showClockStrike({ root: document.body, duration: 4 });
  await showMidnight({ root: document.body, result, onRestart: () => location.reload() });
});

function syncTensions() {
  clock.setTensions(Object.fromEntries(Object.values(track).map((t) => [t.id, t.tension])), { tips: Object.fromEntries(Object.values(track).filter((t) => t.state !== 'collapsed').map((t) => [t.id, t.tip])) });
}

// One track's rules (stand-in for #4): Brink near the fragile tipping point, breach past it,
// collapse if a breach reaches 100.
function step(t) {
  if (t.state === 'collapsed') return;
  const tip = clock.tippingPoint(t.tip);
  if (t.tension >= 100 && t.breached) {
    t.state = 'collapsed';
    log(`${t.name} COLLAPSED.`);
    clock.collapse(t.id);
    t.tension = 100;
  } else if (t.tension >= tip) {
    if (!t.breached) log(`${t.name} breached its tipping point (${tip}).`);
    t.breached = true;
    t.state = 'breach';
  } else {
    t.state = t.tension >= tip - clock.cfg.brinkMargin ? 'brink' : 'calm';
  }
}
function contain(t) {
  if (!t.breached || t.state === 'collapsed') return;
  t.breached = false;
  t.tension = Math.max(0, clock.tippingPoint(t.tip) - 15);
  log(`${t.name} breach contained (tension down to ${t.tension}).`);
  clock.breachContained(t.id);
  t.state = 'calm';
}

const tracksEl = document.getElementById('tracks');
function render() {
  tracksEl.replaceChildren(...Object.values(track).map((t) => {
    const tip = clock.tippingPoint(t.tip);
    const row = document.createElement('div');
    row.className = 'track';
    row.dataset.state = t.state;
    row.dataset.id = t.id;
    row.innerHTML = `<span>${t.name}</span>
      <div class="bar"><div class="fill" style="width:${t.tension}%"></div><div class="brinkline" style="left:${tip - clock.cfg.brinkMargin}%"></div><div class="tip" style="left:${tip}%"></div></div>
      <span class="info">${Math.round(t.tension)} · tip ${tip}${tip < t.tip ? ` (was ${t.tip})` : ''}${t.state !== 'calm' ? ` · ${t.state.toUpperCase()}` : ''}</span>
      <span class="btns"><button data-a="up">+10</button> <button data-a="contain" ${t.breached && t.state !== 'collapsed' ? '' : 'disabled'}>CONTAIN</button></span>`;
    row.querySelector('[data-a=up]').onclick = () => { t.tension = Math.min(100, t.tension + 10); step(t); syncTensions(); render(); };
    row.querySelector('[data-a=contain]').onclick = () => { contain(t); syncTensions(); render(); };
    return row;
  }));
  const s = clock.snapshot();
  document.getElementById('read').innerHTML = `<b>${s.midnight ? '12:00 MIDNIGHT' : s.time}</b>
    ${s.midnight ? 'Midnight has come, uncontrolled.' : s.finalCountdown ? `<span style="color:#ff5a4f">FINAL COUNTDOWN: Midnight in ${s.countdownWeeks} weeks</span>` : `${s.minutes} minutes to Midnight`}<br>
    Floor ${s.floor} min (only moves toward Midnight) · tension alone would give ${s.tensionMinutes} min<br>
    Collapses ${s.collapses}/2 · contained breaches ${s.breachesContained} · tipping points lowered by ${s.minutesLost}<br>
    <span class="formula">M = min(F, 15 − Σtension / 40) = min(${s.floor}, 15 − ${s.tensionSum}/40)</span>`;
  ui.update({ quarter: state.quarter, totalQuarters: 12, heat: 20, tension: Math.round(s.tensionSum / 5), boardTarget: 0 });
  // big face: reuse the HUD's drawing by copying its canvas
  const big = document.getElementById('bigface').getContext('2d');
  big.clearRect(0, 0, 32, 32);
  big.drawImage(hudClock.el.querySelector('canvas'), 0, 0);
}
clock.on('tick', () => requestAnimationFrame(render));

// ---- controls ----
const controls = document.getElementById('controls');
const btn = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = () => { fn(); render(); }; controls.append(b); return b; };
function advanceWeek() {
  clock.advanceWeeks(1);
  state.week += 1;
  if (state.week % 13 === 0 && state.quarter < 12) {
    state.quarter += 1;
    if ((state.quarter - 1) % 3 === 0) { log(`Chapter ${(state.quarter - 1) / 3 + 1} begins.`); clock.chapterStart((state.quarter - 1) / 3 + 1); }
  }
}
btn('ADVANCE 1 WEEK', advanceWeek);
btn('NEW CHAPTER', () => { const n = clock.chapters.size + 2; log(`Chapter ${n} begins.`); clock.chapterStart(n); });
btn('COLLAPSE A TRACK', () => { const t = Object.values(track).find((x) => x.state !== 'collapsed'); if (t) { t.tension = 100; t.breached = true; step(t); syncTensions(); } });
let timer = null;
const stopAuto = () => { clearInterval(timer); timer = null; autoBtn.textContent = 'AUTO-PLAY'; };
// Auto-play: the world drifts hotter each week; the player contains about half of the breaches.
let rngSeed = Number(params.get('seed') ?? 3);
const rng = () => ((rngSeed = (rngSeed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
function autoWeek() {
  for (const t of Object.values(track)) {
    if (t.state === 'collapsed') continue;
    t.tension = Math.min(100, t.tension + Math.round(rng() * 9));
    step(t);
    if (t.breached && t.state !== 'collapsed' && rng() < 0.12) contain(t);
  }
  syncTensions();
  advanceWeek();
}
const autoBtn = btn('AUTO-PLAY', () => {
  if (timer) return stopAuto();
  autoBtn.textContent = 'PAUSE';
  timer = setInterval(() => { autoWeek(); render(); }, Number(params.get('speed') ?? 350));
}, 'hot');
syncTensions();
render();
window.__demo = { clock, track, autoWeek, render, step, contain, state };
</script>
</body>
</html>
