<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events and Guests</title>
<link rel="stylesheet" href="../src/ui/ui.css">
<link rel="stylesheet" href="../src/dialogue/dialogue.css">
<style>
  html, body { margin: 0; background: #14110f; }
  #game { min-height: 100vh; display: flex; flex-direction: column; }
  .ev { display: grid; grid-template-columns: 300px minmax(0, 1fr) 280px; gap: 12px; padding: 12px 16px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box; font-family: var(--at-font); color: var(--at-ink); }
  .pnl { background: var(--at-panel); border: 3px solid var(--at-border); box-shadow: inset 2px 2px 0 var(--at-hi); padding: 10px; align-self: start; }
  .pnl h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 2px; color: var(--at-gold); }
  .pnl h3 { margin: 10px 0 4px; font-size: 11px; letter-spacing: 1px; color: var(--at-dim); }
  .dim { color: var(--at-dim); font-size: 11px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--at-panel-2); font-size: 12px; }
  .row small { display: block; color: var(--at-dim); font-size: 10px; }
  button.b { font: 900 11px var(--at-font); padding: 5px 8px; color: var(--at-paper-ink); background: var(--at-gold); border: 2px solid var(--at-border); cursor: pointer; }
  button.b:disabled { background: var(--at-panel-2); color: var(--at-dim); cursor: not-allowed; }
  button.talk { background: var(--at-green); }
  .met { opacity: .5; }
  .qsel { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 11px; }
  .qsel select { font: 700 12px var(--at-font); background: var(--at-panel-2); color: var(--at-ink); border: 2px solid var(--at-border); }
  .tier-hot { color: var(--at-red); font-weight: 900; } .tier-warm { color: var(--at-amber); font-weight: 900; } .tier-cold { color: var(--at-dim); }
  .stat { font-size: 12px; line-height: 1.7; } .stat b { color: var(--at-gold); }
  .press { color: var(--at-red); font-weight: 700; font-size: 11px; }
  .empty { color: var(--at-dim); font-size: 12px; padding: 20px 4px; }
  @media (max-width: 980px) { .ev { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="game"><div class="ev">
  <section class="pnl" id="left"></section>
  <section class="pnl" id="talk"><div class="empty">Pick an event, then talk to a guest. Calm worlds don't buy bunkers, but a good conversation might.</div></section>
  <section class="pnl" id="right"></section>
</div></div>
<script type="module">
import { Ledger, formatMoney } from '../src/ledger/ledger.js';
import { createGameUI } from '../src/ui/hud.js';
import { Pushback } from '../src/pushback/pushback.js';
import { Press } from '../src/pushback/press.js';
import { loadVenueCatalog } from '../src/events/venues.js';
import { EventCircuit } from '../src/events/attend.js';
import { LeadInventory } from '../src/leads/leads.js';
import { Conversation, treeFor, archetypeFor, ARCHETYPES } from '../src/dialogue/trees.js';
import { applyOutcome } from '../src/dialogue/outcomes.js';
import { createConversationPanel } from '../src/dialogue/dialogue-ui.js';
import { TRACK_BY_ID } from '../src/world/tracks.js';

const params = new URLSearchParams(location.search);
const root = document.getElementById('game');
const ledger = new Ledger({ startingCash: 12_000_000 });
const pb = new Pushback({ ledger });
const press = new Press({ pushback: pb });
const ui = createGameUI({ root, ledger });
let quarter = Number(params.get('q')) || 4;
const catalog = await loadVenueCatalog();
const circuit = new EventCircuit({ catalog, ledger, seed: 3, addHeat: (n, why) => pb.addHeat(n, why), addReputation: (n, why) => press.addReputation(n, why) });
const leads = new LeadInventory({ getQuarter: () => quarter, getReputation: () => press.reputation });
const results = []; // { guest, result, lead }
const L = document.getElementById('left'), T = document.getElementById('talk'), R = document.getElementById('right');
const fearNames = (g) => (g.fears ?? []).map((f) => TRACK_BY_ID[f]?.name ?? f).join(', ');

function hud() { ui.update({ quarter, totalQuarters: 12, heat: pb.heat, tension: 0, boardTarget: 0 }); }

function renderLeft() {
  L.replaceChildren();
  const v = circuit.current;
  if (!v) {
    L.innerHTML = `<h2>EVENTS THIS QUARTER</h2><div class="qsel">QUARTER <select id="q">${Array.from({ length: 12 }, (_, i) => `<option ${i + 1 === quarter ? 'selected' : ''}>${i + 1}</option>`).join('')}</select> <span class="dim">agenda: ${6 - (circuit.daysUsed[quarter] ?? 0)} of 6 days left</span></div>`;
    L.querySelector('#q').onchange = (e) => { quarter = Number(e.target.value); leads.expire(quarter); render(); };
    for (const o of circuit.options(quarter)) {
      if (o.reason === 'not running this quarter') continue;
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<span>${o.venue.name}<small>${formatMoney(o.venue.cost.cash)} · ${o.venue.cost.days} day${o.venue.cost.days > 1 ? 's' : ''} · press ${Math.round(o.venue.exposure.press * 100)}%${o.reason ? ` · ${o.reason}` : ''}</small></span>`;
      const b = document.createElement('button');
      b.className = 'b'; b.textContent = 'ATTEND'; b.disabled = !o.canAttend;
      b.onclick = () => { circuit.attend(o.venue.id, { quarter }); render(); };
      r.append(b);
      L.append(r);
    }
    return;
  }
  L.innerHTML = `<h2>${v.venueName.toUpperCase()}</h2>${v.press ? '<div class="press">A journalist is in the room.</div>' : '<div class="dim">No press tonight.</div>'}<h3>GUEST LIST</h3>`;
  for (const g of v.guests) {
    const met = v.met.includes(g.id);
    const r = document.createElement('div');
    r.className = `row ${met ? 'met' : ''}`;
    r.innerHTML = `<span>${g.name} <span class="dim">${g.wealthClass}</span><small>${ARCHETYPES[archetypeFor(g)].label} · ${g.regionName} · fears ${fearNames(g) || '?'}</small></span>`;
    const b = document.createElement('button');
    b.className = 'b talk'; b.textContent = met ? 'MET' : 'TALK'; b.disabled = met;
    b.onclick = () => talk(g);
    r.append(b);
    L.append(r);
  }
  const leave = document.createElement('button');
  leave.className = 'b'; leave.textContent = 'LEAVE THE EVENT'; leave.style.marginTop = '10px';
  leave.onclick = () => { circuit.leave(); T.innerHTML = '<div class="empty">You slip out before the speeches.</div>'; render(); };
  L.append(leave);
}

function talk(guest) {
  const conversation = new Conversation({ guest, tree: treeFor(guest) });
  createConversationPanel({
    root: T, conversation, context: { journalistPresent: circuit.current?.press },
    onDone: (result) => {
      const { lead } = applyOutcome(result, { leads, pushback: pb, press, guest, venueId: guest.venueId });
      circuit.meet(guest.id);
      results.push({ guest, result, lead });
      T.innerHTML = `<div class="empty">${result.win ? `${guest.name} is in your pipeline.` : `${guest.name} drifts back into the crowd.`} Who's next?</div>`;
      render();
    },
  });
}

function renderRight() {
  const open = leads.open();
  const iris = press.journalists.iris.story, gil = press.journalists.gil.story;
  R.innerHTML = `<h2>THE BOOKS</h2><div class="stat">Cash <b>${formatMoney(ledger.cash)}</b><br>Heat <b>${Math.round(pb.heat)}</b> · Reputation <b>${press.reputation}</b><br>
    Iris Kemp story <b>${iris ? Math.round(iris.progress) + '%' : '-'}</b> · Gil Marsh story <b>${gil ? Math.round(gil.progress) + '%' : '-'}</b></div>
    <h3>LEAD PIPELINE · ${open.length} OPEN</h3>`;
  for (const l of open) {
    const r = document.createElement('div');
    r.className = 'row';
    r.innerHTML = `<span>${l.guest.name} <span class="tier-${l.tier}">${l.tier.toUpperCase()}</span><small>${l.wealthClass} · quality ${l.quality}${l.leverage ? ` · leverage +${l.leverage}` : ''} · ${l.source.ending?.replace('_', ' ') ?? ''} · until Q${l.expiresQuarter}</small></span>`;
    R.append(r);
  }
  if (!open.length) R.insertAdjacentHTML('beforeend', '<div class="dim">No leads yet.</div>');
  if (results.length) {
    R.insertAdjacentHTML('beforeend', '<h3>TONIGHT</h3>');
    for (const x of results.slice(-6).reverse()) R.insertAdjacentHTML('beforeend', `<div class="row"><span>${x.guest.name}<small>${x.result.label}${x.result.heat ? ` · heat +${x.result.heat}` : ''}${x.result.reputation ? ` · rep ${x.result.reputation}` : ''}${x.result.slips.length ? ' · SLIP' : ''}</small></span></div>`);
  }
}

function render() { renderLeft(); renderRight(); hud(); }
pb.on?.('change', () => { renderRight(); hud(); });
render();
window.__demo = { circuit, leads, pb, press, ledger, talk, render, setQuarter: (q) => { quarter = q; render(); } };
</script>
</body>
</html>
